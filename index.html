<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра для Двоих</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { @apply bg-gradient-to-br from-blue-500 to-purple-500 text-white; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white/10 rounded-lg shadow-lg p-8 max-w-md w-full">
        <h1 class="text-3xl font-bold mb-6 text-center">Игра для Двоих</h1>
        <div class="grid grid-cols-2 gap-4">
            <div class="relative flex items-center justify-center rounded-lg p-6 bg-white/10">
                <p class="text-2xl font-semibold">Игрок 1</p>
                <div class="absolute top-0 right-0 w-10 h-10 rounded-full bg-blue-500 shadow"></div>
            </div>
            <div class="relative flex items-center justify-center rounded-lg p-6 bg-white/10">
                <p class="text-2xl font-semibold">Игрок 2</p>
                <div class="absolute top-0 right-0 w-10 h-10 rounded-full bg-pink-500 shadow"></div>
            </div>
        </div>
        <div class="mt-8">
            <button class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-full">Начать Игру</button>
        </div>
    </div>
</body>
</html>
